[package]
name = "hcompare"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Fast desktop folder, text and CSV comparison tool"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
egui = "=0.31.1"
egui_extras = "=0.31.1"
similar = "2.6"
csv = "1.3"
walkdir = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
rfd = "0.15"
unicode-width = "0.2"
pdf-extract = "0.12.1"
zip = { version = "7.3", default-features = false, features = ["deflate-flate2"] }
quick-xml = "0.41"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
