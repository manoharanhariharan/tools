[package]
name = "fv-cli"
description = "Headless harness for the Finvasia rewrite: replay, bench, master, doctor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "h-finvasia"
path = "src/main.rs"

[dependencies]
fv-core.workspace = true
fv-feed.workspace = true
fv-master.workspace = true
fv-store.workspace = true
fv-engine.workspace = true

clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["ws", "mongo"]
ws = ["fv-feed/ws"]
mongo = ["fv-master/mongo", "fv-store/mongo"]
