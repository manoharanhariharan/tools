[package]
name = "hr-files"
description = "SFTP/FTP file browsing and transfer engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
hr-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing.workspace = true
russh = { version = "0.54", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "4"
suppaftp = { version = "6.3", default-features = false, features = ["async"] }

[dev-dependencies]
tempfile.workspace = true
