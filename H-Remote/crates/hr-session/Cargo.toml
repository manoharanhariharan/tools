[package]
name = "hr-session"
description = "RDP session engine, lifecycle state machine and bounded frame transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
hr-core.workspace = true
hr-config.workspace = true
hr-domain.workspace = true
hr-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "fs"] }
tracing.workspace = true
ulid.workspace = true

ironrdp = { version = "0.17", features = ["input", "pdu"] }
ironrdp-client = { version = "0.1", default-features = false, features = [
    "clipboard",
    "rdpdr",
    "gateway",
    "smartcard",
    "rustls",
    "sound",
] }
ironrdp-session = "0.11"
ironrdp-connector = "0.10"
ironrdp-pdu = "0.9"
ironrdp-propertyset = "0.1"
ironrdp-input = "0.7"
ironrdp-graphics = "0.9"
vnc-rs = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile.workspace = true
